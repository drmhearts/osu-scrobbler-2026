name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build and smoke-test standalone Windows download
        shell: pwsh
        run: |
          python tools/build_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Release assets could not build' }
          python tools/build_windows.py
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Windows runtime failed validation' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
          retention-days: 7

  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('test-results.xml')
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  for kind in ('failure', 'error'):
                      failure = case.find(kind)
                      if failure is not None:
                          message = case.attrib['name'] + ': ' + (failure.text or '')
                          message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                          print('::error::' + message)
          PY
