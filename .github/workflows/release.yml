name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build verified release assets
        run: python tools/build_release.py --tag "$GITHUB_REF_NAME"
      - name: Publish stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl dist/osu-scrobbler-windows-source.zip dist/SHA256SUMS.txt
          --verify-tag --title "osu! scrobbler $GITHUB_REF_NAME"
          --notes-file docs/release-notes.md --generate-notes
