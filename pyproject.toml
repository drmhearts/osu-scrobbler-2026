[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "osu-scrobbler"
version = "0.2.6"
description = "A Windows-first terminal osu! scrobbler using tosu, MusicBrainz and Last.fm"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1", "websockets>=14,<17", "keyring>=25,<27", "Unidecode>=1.3,<2",
    "psutil>=6,<8; sys_platform == 'win32'",
    "pystray>=0.19,<0.20; sys_platform == 'win32'",
    "Pillow>=11,<13; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
osu-scrobbler = "osu_scrobbler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
